<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Movie Hub | Aman</title>
    <!-- Single FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header class="main-header">
        <div class="logo" onclick="navigateTo('home')">
            <h1>UNIVERSAL<span>HUB</span></h1>
        </div>
        <div class="header-right">
            <select id="langSelect" onchange="setLanguage(this.value)" class="lang-select" aria-label="Select Language">
                <option value="en-US">English</option>
                <option value="hi-IN">Hindi (हिंदी)</option>
            </select>
        </div>
    </header>

    <!-- Search Section -->
    <div class="search-container">
        <div class="search-box">
            <button id="searchBtn" class="search-icon-btn" aria-label="Search" onclick="handleSearchClick()">
                <i class="fas fa-search"></i>
            </button>
            <input type="text" id="searchInput" placeholder="Search movies, TV series, anime..." autocomplete="off">
            <button id="clearSearchBtn" class="clear-btn" aria-label="Clear Search" onclick="clearSearch()">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <!-- Desktop Navigation -->
    <nav class="desktop-nav">
        <a href="javascript:void(0)" class="nav-link active" data-section="home">Home</a>
        <a href="javascript:void(0)" class="nav-link" data-section="movies">Movies</a>
        <a href="javascript:void(0)" class="nav-link" data-section="series">Series</a>
        <a href="javascript:void(0)" class="nav-link" data-section="anime">Anime</a>
        <a href="javascript:void(0)" class="nav-link" data-section="watchlist">Watchlist</a>
    </nav>

    <!-- Main Content Container -->
    <main id="appContent">
        <!-- Home Section -->
        <section id="home" class="content-section active">
            <!-- Search Results Area (Hidden by default, shown during search) -->
            <div id="searchResultsSection" style="display: none;">
                <div class="section-header-row">
                    <h2 id="searchResultsTitle" class="section-title">Search Results</h2>
                    <button class="reset-search-btn" onclick="clearSearch()">Back to Home</button>
                </div>
                <div id="searchResultsGrid" class="movie-grid"></div>
            </div>

            <!-- Home Default Content (Hidden during search) -->
            <div id="homeDefaultRows">
                <h2 class="section-title">Trending Now</h2>
                <div id="trendingContent" class="movie-grid"></div>

                <h2 class="section-title">Popular Movies</h2>
                <div id="popularMovies" class="movie-grid"></div>

                <h2 class="section-title">Must-Watch Series</h2>
                <div id="topSeries" class="movie-grid"></div>

                <h2 class="section-title">Epic Anime</h2>
                <div id="animeCollection" class="movie-grid"></div>
            </div>
        </section>

        <!-- Movies Section -->
        <section id="movies" class="content-section">
            <h2 class="section-title">Explore Movies</h2>
            <div id="moviesGrid" class="movie-grid"></div>
        </section>

        <!-- TV Series Section -->
        <section id="series" class="content-section">
            <h2 class="section-title">TV Series</h2>
            <div id="seriesGrid" class="movie-grid"></div>
        </section>

        <!-- Anime Section -->
        <section id="anime" class="content-section">
            <h2 class="section-title">Japanese Anime</h2>
            <div id="animeGrid" class="movie-grid"></div>
        </section>

        <!-- Watchlist Section -->
        <section id="watchlist" class="content-section">
            <div class="section-header-row">
                <h2 class="section-title">My Watchlist</h2>
                <button id="clearWatchlistBtn" class="clear-watchlist-btn" onclick="clearAllWatchlist()" style="display:none;">Clear All</button>
            </div>
            <div id="watchlistGrid" class="movie-grid"></div>
        </section>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav">
        <div class="bottom-nav-item active" data-section="home">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </div>
        <div class="bottom-nav-item" data-section="movies">
            <i class="fas fa-film"></i>
            <span>Movies</span>
        </div>
        <div class="bottom-nav-item" data-section="series">
            <i class="fas fa-tv"></i>
            <span>Series</span>
        </div>
        <div class="bottom-nav-item" data-section="anime">
            <i class="fas fa-dragon"></i>
            <span>Anime</span>
        </div>
        <div class="bottom-nav-item" data-section="watchlist">
            <i class="fas fa-bookmark"></i>
            <span>Saved</span>
        </div>
    </nav>

    <!-- Details & Video Player Modal -->
    <div id="detailsModal" class="modal" onclick="handleBackdropClick(event)">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()" aria-label="Close modal">&times;</button>
            <div id="detailsContent"></div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="spinner-overlay">
        <div class="loader"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
